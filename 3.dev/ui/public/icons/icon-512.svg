<?xml version="1.0" encoding="UTF-8"?>
<!-- 512x512 高清版 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bg512)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <text x="256" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="208" font-weight="800" fill="#fff" filter="url(#glow512)">YJ</text>
  <text x="256" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="500" fill="rgba(255,255,255,0.8)">编程工作站</text>
</svg>
