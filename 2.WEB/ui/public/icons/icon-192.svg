<?xml version="1.0" encoding="UTF-8"?>
<!--
  YJ Workstation Logo
  2026-06-09 TASK-4.3 PWA 图标
  设计：渐变圆形背景 + 白色 "YJ" 字母
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <rect x="0" y="0" width="192" height="192" rx="40" ry="40" fill="url(#bg)"/>
  <!-- 内圈装饰 -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- 文字 YJ -->
  <text x="96" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" fill="#fff" filter="url(#glow)">YJ</text>
  <!-- 副标 -->
  <text x="96" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.8)">编程工作站</text>
</svg>
