<!doctype html>
<!--
  offline.html — PWA 离线 fallback
  2026-06-09 TASK-4.3 引入
  - 当导航请求失败时由 Service Worker 返回
  - iOS PWA 启动时也可能作为入口
  - 设计：暗色品牌色 + 居中图标 + 重试按钮 + 缓存页面链接
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>离线模式 · 云集智能编程工作站</title>
    <style>
      :root {
        --bg: #0d0d0d;
        --bg-card: #1a1a2e;
        --border: #2a2a44;
        --text: #e0e0e0;
        --text-secondary: #888;
        --accent: #42a5f5;
        --accent-dark: #1565c0;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .icon-wrap {
        width: 120px; height: 120px;
        background: var(--bg-card);
        border: 2px solid var(--border);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        box-shadow: 0 8px 32px rgba(66, 165, 245, 0.15);
      }
      .icon-wrap svg { width: 64px; height: 64px; }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .badge {
        display: inline-block;
        background: rgba(245, 158, 11, 0.15);
        color: var(--warning);
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 24px;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      p {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.6;
        max-width: 360px;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 280px;
      }
      .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover { background: var(--accent-dark); }
      .btn-secondary {
        background: var(--bg-card);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: #222240; }
      .cached-list {
        margin-top: 24px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .cached-link {
        padding: 6px 12px;
        background: var(--bg-card);
        color: var(--accent);
        text-decoration: none;
        border-radius: 6px;
        font-size: 12px;
        border: 1px solid var(--border);
      }
      .cached-link:hover { background: #222240; }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f5;
          --bg-card: #fff;
          --border: #e0e0e0;
          --text: #1a1a1a;
          --text-secondary: #666;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L4 7 L4 17 L12 22 L20 17 L20 7 Z" stroke="#42a5f5" stroke-width="1.5" fill="rgba(66,165,245,0.1)" />
          <path d="M9 12 L11 14 L15 10" stroke="#42a5f5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="4" y1="4" x2="20" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
        </svg>
      </div>
      <span class="badge">⚡ 离线模式</span>
      <h1>网络连接中断</h1>
      <p>当前无法连接到云集编程工作站。你可以访问已缓存的页面，恢复网络后所有功能将自动可用。</p>
      <div class="actions">
        <button class="btn btn-primary" onclick="window.location.reload()">🔄 重新连接</button>
        <a href="/" class="btn btn-secondary" style="text-decoration:none; text-align:center;">🏠 回到主页</a>
      </div>
      <div class="cached-list">
        <a href="/projects" class="cached-link">📁 项目</a>
        <a href="/knowledge" class="cached-link">📚 知识</a>
        <a href="/settings" class="cached-link">⚙️ 设置</a>
      </div>
    </div>
    <script>
      // 自动检测网络恢复
      window.addEventListener('online', () => {
        console.log('[offline] network back, reloading')
        window.location.reload()
      })
    </script>
  </body>
</html>
