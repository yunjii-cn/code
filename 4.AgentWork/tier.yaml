# 云集智能体工作台 - 商业模式
# version: 1.0
# updated: 2026-06-17
# status: 草案 v1.0，待 M5 商业化前调整

# ============================================================
# 产品信息
# ============================================================
product:
  code_name: "AW"
  code_name_expansion: "AI-Work (3 字母简称)"
  chinese_name: "云集智能体工作台"
  english_name: "AgentWork"
  abbreviation: "AW"
  tagline: "AI Agent Workbench"
  tagline_long: "Git-Native AI Agent Workbench"
  positioning: "Enterprise / 商务旗舰"
  target_audience: "5-500 人研发团队 / 上市公司工程效能团队"
  launch_date_target: "2026-11 (GA) / 2026-09 (Beta)"
  website: "https://agentwork.yunji.ai"  # 筹备中
  contact_email: "agentwork@yunji.ai"
  github_org: "yunji/agentwork"  # 仓库用品牌名 agentwork 而非简称 aw
  gitee_org: "yunji/agentwork"
  cli_command: "aw"  # CLI 命令用简称
  crate_prefix: "aw"  # crate 用简称
  npm_scope: "@aw"  # npm scope 用简称

# 命名约定：
#   - 品牌/对外：使用 "AgentWork"（避免与 AWS 混淆）
#   - 机器/技术标识符：使用 "aw"（CLI、crate、commit scope、npm scope）
#   - 中文：使用 "云集智能体工作台"

# ============================================================
# 技术差异化（核心卖点）
# ============================================================
differentiation:
  - id: "git_native"
    title: "Git-Native 工作流"
    description: "Agent 任务结果以 PR 形式交付，可审计、可回放、可回滚"
    competitors_weakness: "Copilot/Devin 任务结果需手动 git 操作，Cursor 不支持"
    
  - id: "open_source"
    title: "开源 Apache 2.0"
    description: "核心代码完全开源，企业可自部署、可审计"
    competitors_weakness: "Devin 完全闭源，Cursor 闭源，Copilot 闭源"
    
  - id: "mcp_standard"
    title: "MCP 标准协议"
    description: "工具接入基于 Model Context Protocol，生态丰富"
    competitors_weakness: "Cursor 使用私有协议，工具接入受限"
    
  - id: "tauri_desktop"
    title: "Tauri 2 桌面"
    description: "安装包 < 10MB（vs Electron 100MB+），内存占用 1/5"
    competitors_weakness: "Devin 仅 Web，Cursor 仅编辑器插件"
    
  - id: "skills_market"
    title: "Skills 市场"
    description: "可复用任务模板，团队/社区共享，持续积累"
    competitors_weakness: "Copilot 提示词市场弱，无版本管理"
    
  - id: "sandbox_security"
    title: "Docker 沙箱 + 审计"
    description: "Agent 执行环境完全隔离，每次操作全审计"
    competitors_weakness: "Devin 云端沙箱黑盒，Cursor 无沙箱"

