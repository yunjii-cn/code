      - "团队对齐会"
      
  - milestone: "M1"
    date: "2026-07 上"
    goal: "Tauri 桌面骨架 + Git 集成"
    deliverables:
      - "Tauri 2 桌面骨架"
      - "libgit2 clone/commit/PR 跑通"
      - "本地 SQLite 存储"
      - "5 个基础 UI 页面"
      
  - milestone: "M2"
    date: "2026-07 下"
    goal: "Agent Runtime + MCP Bridge"
    deliverables:
