# ============================================================
# 竞品分析
# ============================================================
competition:
  direct_competitors:
    - name: "GitHub Copilot Workspace"
      vendor: "Microsoft / GitHub"
      pricing: "$19/月 (Pro) / $39/月 (Business)"
      weakness: "闭源、不支持本地、无 MCP、无 Skills 市场"
      our_advantage: "开源 + 本地 + MCP + Skills"
      
    - name: "Cursor"
      vendor: "Anysphere"
      pricing: "$20/月 (Pro) / $40/月 (Business)"
      weakness: "编辑器插件形态、闭源、需云端、无 PR 自动生成"
      our_advantage: "完整 IDE 替代 + 开源 + PR 自动化"
      
    - name: "Devin"
      vendor: "Cognition AI"
      pricing: "$500/月 (Team)"
      weakness: "完全闭源、云端、$500 高价、沙箱黑盒"
      our_advantage: "Apache 2.0 开源 + 本地 + 价格低 5x"
      
    - name: "OpenHands Cloud"
      vendor: "All Hands AI"
      pricing: "$0 (自部署) / 商业云定价 TBD"
      weakness: "云端为主、本地体验弱、Skills 市场未成熟"
      our_advantage: "Tauri 2 本地优先 + Skills 先行"

  adjacent_competitors:
    - name: "WorkBuddy"
      vendor: "OpenClaw 社区"
      pricing: "开源"
      weakness: "成熟度低，无 Skills 市场"
      our_advantage: "商业化 + Skills + 企业服务"

  # ----------------------------------------------------------
  # 参考项目（reference_projects）
  # 业界成熟的同方向项目，我们借鉴架构/工程实践
  # 但不做竞品（赛道不同或定位不同）
  # ----------------------------------------------------------
  reference_projects:
    - name: "UI-TARS-desktop"
      vendor: "字节跳动 (bytedance)"
      github: "https://github.com/bytedance/UI-TARS-desktop"
      license: "Apache-2.0"
      stars: "34K+ (2026-05 数据 34,238)"
      commits: 1109
      branches: 275
      tags: 547
      first_release: "2025-01-21"
      category: "架构参考 / Monorepo 模板"
      positioning: "GUI Agent 桌面 + 通用 Agent 栈 (Agent TARS CLI/Web)"
      tech_stack:
        - "TypeScript 5"
        - "pnpm workspace + Turbo"
        - "Electron (桌面) / CLI + Web UI"
        - "MCP 协议集成"
        - "多模态 (Vision-Language Model)"
      monorepo_structure:
        apps: "apps/ui-tars (桌面)"
        packages: "packages/* (共享 SDK)"
        multimodal: "multimodal/ (多模态核心)"
        infra: "infra/ (基础设施 / 发布工程)"
        rfcs: "rfcs/ (设计文档)"
        examples: "examples/ (示例项目)"
        docs: "docs/ (用户文档)"
      what_we_learn:
        - "✅ Monorepo 布局：apps/ + packages/ + 多个领域目录（multimodal/infra），分类清晰"
        - "✅ MCP 集成模式：MCP 作为核心依赖，工具生态可扩展"
        - "✅ Turbo + pnpm workspace：构建缓存加速 CI"
        - "✅ rfcs/ 目录：所有 RFC 设计文档独立管理，便于追溯决策"
        - "✅ 多个 apps 共享 packages：代码复用最大化"
        - "⚠️ 注意：他们用 Electron，我们用 Tauri 2（避免重复 Electron 体积问题）"
        - "⚠️ 赛道差异：他们做 GUI Agent（操控电脑），我们做 Git-Native 代码 Agent（写代码提 PR）"
      threat_level: "🟢 低（同开源 Apache 2.0，赛道垂直差异化，潜在生态互操作）"
      partnership_potential: "可探索：MCP 工具互认、SDK 互相引用、联合发布 Skills"
      related_projects:
        - name: "UI-TARS (模型层)"
          github: "https://github.com/bytedance/UI-TARS"
          note: "UI-TARS-desktop 的视觉语言模型基座"
        - name: "Agent TARS"
          github: "UI-TARS-desktop 仓库内"
          note: "通用多模态 Agent 栈 (CLI + Web UI)"

  market_size:
    tam: "全球 3000 万开发者 × $20/月 ≈ $7.2B/年"
    sam: "中国 800 万开发者 × ¥99/月 ≈ 95 亿/年"
    som: "3 年目标 1% 市场 ≈ 1 亿/年"

