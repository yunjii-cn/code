    expected_output: "根据描述，您在对比 Intel i7 与 i9。建议排查您的用途：游戏/办公 i7 足够，专业渲染建议 i9。"
    weight: 1.2
    category: 售前-参数对比
    notes: 同品牌跨档位对比

  - id: eval_008
    input: "游戏本和轻薄本怎么选？"
    rubric: |-
      正确对比游戏本与轻薄本的核心差异（性能/重量/续航/散热）。
