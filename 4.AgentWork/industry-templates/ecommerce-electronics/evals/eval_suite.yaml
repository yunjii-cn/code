      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您咨询充电器兼容性。建议排查充电器协议与手机支持协议是否匹配，参考手册确认。"
