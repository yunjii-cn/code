    expected_output: "根据描述，您在对比 MacBook 与 Windows 笔记本。建议排查您的软件需求，参考手册确认兼容性。"
    weight: 1.3
    category: 售前-参数对比
    notes: 跨平台笔记本对比

  - id: eval_007
    input: "Intel i7 和 i9 区别大吗？"
    rubric: |-
      正确对比 Intel i7 与 i9 的核心差异（核心数/线程/频率/性能差距）。
      根据用途给出选型建议，评估性价比。
