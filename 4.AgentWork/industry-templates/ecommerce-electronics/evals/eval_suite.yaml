      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您咨询路由器 Mesh 组网能力。建议排查您现有的路由器型号，跨品牌组网建议参考手册确认。"
    weight: 1.2
    category: 售前-兼容性查询
