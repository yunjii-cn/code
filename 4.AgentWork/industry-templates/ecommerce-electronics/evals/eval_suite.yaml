  # 售前 - 选型与兼容性（3 条）
  # ============================================================

  - id: eval_009
    input: "5000 元预算买什么手机？"
    rubric: |-
      根据预算提供 3+ 款机型推荐，按需求分类（拍照/游戏/商务/性价比）。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
      不推荐金融产品（分期/消费贷）。
    expected_output: "根据描述，您预算 5000 元购机。建议排查您的偏好：注重拍照选 iPhone 15/vivo X100，注重游戏选 iQOO 12。"
    weight: 1.3
    category: 售前-选型建议
    notes: 预算导向选型

