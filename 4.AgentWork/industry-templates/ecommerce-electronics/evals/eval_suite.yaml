# 电商-电子行业评估套件
# 模板: ecommerce-electronics
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 2
#
# 评估方式：LLM-as-Judge + 约束检查
# 评分维度：风格 / 相关性 / 约束 / 总分（0-10）
# 通过标准：总分 >= 6.0 且无约束违规

# 套件 ID
id: ecommerce_electronics_eval_v1

# 套件名称
name: 电商-电子行业评估套件

# 所属员工 ID
employee_id: tech_advisor

# 场景描述
scenario: 3C数码技术咨询

# 版本号
version: 1.0.0

# 创建时间
created_at: 2026-06-19

# 评估用例列表（22 条）
cases:
  # ============================================================
  # 售前 - 参数对比（8 条）
  # ============================================================

  - id: eval_001
    input: "iPhone 15 和 16 怎么选？"
    rubric: |-
      正确对比 iPhone 15 与 16 的核心差异（处理器/内存/相机/操作按钮）。
      根据使用场景给出选型建议，不夸大不贬低。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您在对比 iPhone 15 与 16。主要差异：1) 处理器：15 搭载 A16，16 升级至 A18；2) 内存：15 为 6GB，16 为 8GB。建议排查您的使用场景后决策。"
    weight: 1.5
    category: 售前-参数对比
    notes: iPhone 跨代对比，核心参数差异

  - id: eval_002
    input: "Intel i5 和 AMD R5 哪个好？"
    rubric: |-
      正确对比 Intel i5 与 AMD R5 的核心差异（核心数/线程/单核多核性能）。
      根据用途（游戏/多任务）给出选型建议。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您在对比 Intel i5 与 AMD R5。建议排查您的用途：游戏/办公选 Intel 单核优势明显；多任务/渲染选 AMD 多核性价比高。"
    weight: 1.5
    category: 售前-参数对比
    notes: CPU 跨品牌对比，需客观中立

  - id: eval_003
    input: "骁龙 8 Gen3 和天玑 9300 哪个强？"
    rubric: |-
      正确对比骁龙 8 Gen3 与天玑 9300 的核心差异（架构/GPU/AI）。
      根据用途给出选型建议。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您在对比骁龙 8 Gen3 与天玑 9300。建议排查您的用途：游戏选骁龙，日常多任务选天玑。"
    weight: 1.3
    category: 售前-参数对比
    notes: 手机处理器对比

  - id: eval_004
    input: "OLED 和 LCD 屏幕哪个好？"
    rubric: |-
      正确对比 OLED 与 LCD 的核心差异（对比度/色彩/响应速度/烧屏/价格）。
      根据用途给出选型建议。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您在对比 OLED 与 LCD 屏幕。建议排查您的用途：影音游戏选 OLED，护眼与预算敏感选 LCD。"
    weight: 1.2
    category: 售前-参数对比
    notes: 屏幕技术对比

  - id: eval_005
    input: "RTX 4060 和 4070 差距大吗？"
    rubric: |-
      正确对比 RTX 4060 与 4070 的核心差异（CUDA 核心/显存/性能/价格）。
      根据分辨率需求给出选型建议。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 兼容"等词。
    expected_output: "根据描述，您在对比 RTX 4060 与 4070。建议排查您的分辨率：1080P 选 4060 足够，2K 建议选 4070。"
    weight: 1.3
    category: 售前-参数对比
    notes: 显卡对比

  - id: eval_006
    input: "MacBook 和 Windows 笔记本怎么选？"
    rubric: |-
      正确对比 MacBook 与 Windows 的核心差异（系统/处理器/软件兼容/价格）。
