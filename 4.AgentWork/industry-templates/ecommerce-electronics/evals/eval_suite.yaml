  # ============================================================

  - id: eval_012
    input: "手机发热严重怎么办？"
    rubric: |-
      提供手机发热排查步骤（后台应用/充电使用/环境温度）。
      给出温度阈值建议（>45°C 联系售后）。
      必须包含"根据描述"或"建议排查"或"参考手册"。
      禁用"绝对稳定""保证无故障""100% 修复"等词。
      不指导自行拆机。
    expected_output: "根据描述，您反馈手机发热问题。建议排查后台应用、充电使用、环境温度等因素，如持续高温建议参考手册联系售后。"
    weight: 1.5
    category: 售后-故障排查
    notes: 手机发热排查

