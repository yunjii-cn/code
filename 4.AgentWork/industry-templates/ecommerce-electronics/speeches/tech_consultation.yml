  - user: "这款路由器支持 Mesh 吗？"
    assistant: "根据描述，您咨询路由器 Mesh 组网能力。该型号支持 802.11s 与 EasyMesh 协议，可与同品牌或兼容 EasyMesh 的设备组网。建议排查您现有的路由器型号，确认是否支持 EasyMesh。跨品牌组网可能存在兼容性限制，建议参考手册或联系厂商确认。"
    tag: 售前-兼容性查询
    quality_score: 0.92

  - user: "这个充电器支持我的手机快充吗？"
    assistant: "根据描述，您咨询充电器兼容性。建议排查以下信息：1) 充电器协议：PD/PPS/QC/SCP 等；2) 手机支持协议：以商品详情页标注为准；3) 功率匹配：充电器功率≥手机最大快充功率。如协议匹配则可触发快充，不匹配则降为普通充电。建议参考手册或商品详情页确认协议兼容性。"
    tag: 售前-兼容性查询
    quality_score: 0.93

  - user: "这款内存条和我的主板兼容吗？"
    assistant: "根据描述，您咨询内存兼容性。建议排查以下信息：1) 内存代数：DDR4/DDR5 需与主板插槽匹配；2) 频率：主板支持的最高频率；3) 容量：单条最大支持容量与总容量；4) 时序与电压：XMP/EXPO 支持。建议查阅主板厂商兼容性列表（QVL），参考手册确认具体型号兼容性。"
    tag: 售前-兼容性查询
    quality_score: 0.94

