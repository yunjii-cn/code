  # 装机指导 - 路由器类（5 条）
  # ============================================================

  - user: "新买的路由器怎么设置？"
    assistant: "根据描述，您需要配置新路由器。建议按以下步骤操作：\n步骤 1：硬件连接。将光猫 LAN 口用网线连接路由器 WAN 口，接通电源。\n步骤 2：登录管理后台。手机连接默认 Wi-Fi（见路由器底部标签），浏览器访问 192.168.1.1 或对应管理地址。\n步骤 3：配置上网方式。家庭宽带一般选 PPPoE，输入宽带账号密码；如光猫已拨号则选动态 IP。\n步骤 4：设置无线网络。自定义 Wi-Fi 名称与密码，建议 WPA3 或 WPA2 加密。\n如遇问题建议参考手册或联系运营商确认宽带账号。"
    tag: 装机-路由器配置
    quality_score: 0.96

  - user: "路由器怎么设置 Mesh 组网？"
    assistant: "根据描述，您需要配置 Mesh 组网。建议按以下步骤操作：\n步骤 1：确认主路由支持 Mesh（EasyMesh/品牌私有协议）。\n步骤 2：子路由通电，靠近主路由（1 米内）。\n步骤 3：主路由管理后台→Mesh 设置→添加子节点，按提示操作。\n步骤 4：组网成功后，将子路由移至信号薄弱区域，建议与主路由距离不超过 2 堵墙。\n步骤 5：验证漫游，手机连接 Wi-Fi 移动，确认自动切换无断线。\n跨品牌组网兼容性建议参考手册。"
    tag: 装机-路由器配置
    quality_score: 0.94

  - user: "路由器信号不好怎么优化？"
    assistant: "根据描述，您需要优化路由器信号。建议排查以下方案：1) 摆放位置：放房屋中央开阔处，远离金属/电器/承重墙；2) 天线角度：多天线呈不同方向（一根垂直一根水平）；3) 信道优化：管理后台选 1/6/11 等不拥挤信道；4) 频段选择：5G 速率快穿墙弱，2.4G 穿墙强速率慢；5) 大户型建议 Mesh 组网。详细设置建议参考手册。"
    tag: 装机-路由器配置
    quality_score: 0.93

  - user: "怎么修改 WiFi 密码？"
    assistant: "根据描述，您需要修改 WiFi 密码。建议按以下步骤操作：\n步骤 1：电脑/手机连接路由器 WiFi，浏览器访问管理地址（如 192.168.1.1，见路由器底部标签）。\n步骤 2：输入管理员密码登录。\n步骤 3：找到「无线设置」或「WiFi 设置」。\n步骤 4：修改密码（建议 8 位以上，含字母数字），保存。\n步骤 5：已连接设备需重新输入新密码连接。\n如忘记管理员密码，建议参考手册重置路由器。"
    tag: 装机-路由器配置
    quality_score: 0.92

  - user: "路由器怎么设置访客网络？"
    assistant: "根据描述，您需要配置访客网络。建议按以下步骤操作：\n步骤 1：登录路由器管理后台。\n步骤 2：找到“访客网络”或“Guest Network”设置。\n步骤 3：开启访客网络，设置独立 SSID 与密码。\n步骤 4：建议设置限时（如 2 小时）与隔离（禁止访问主网络设备）。\n步骤 5：保存后访客连接独立 WiFi，不影响主网络安全。\n不同品牌路径可能不同，建议参考手册。"
    tag: 装机-路由器配置
    quality_score: 0.91

  # ============================================================
  # 装机指导 - 智能家居/NAS（5 条）
  # ============================================================

  - user: "智能家居怎么联动？"
    assistant: "根据描述，您需要配置智能家居联动。建议按以下步骤操作：\n步骤 1：选择主控平台。米家/华为 HiLink/HomeKit 任选其一，下载对应 App 注册账号。\n步骤 2：添加设备。确保设备通电并处于配网模式，App 扫码或自动发现设备。\n步骤 3：创建场景。例如“回家模式”：开门触发→开灯+开空调；“离家模式”：关门触发→关灯+关空调。\n步骤 4：设置自动化。根据时间/位置/设备状态触发联动。\n不同品牌设备兼容性建议参考手册或平台兼容性列表。"
    tag: 装机-智能家居
    quality_score: 0.95

  - user: "智能音箱怎么连接控制设备？"
    assistant: "根据描述，您需要配置智能音箱控制。建议按以下步骤操作：\n步骤 1：音箱通电，下载对应 App（小爱同学/天猫精灵/小度）。\n步骤 2：App 添加音箱，按提示连接 WiFi。\n步骤 3：App 内添加智能设备（灯/插座/空调），确保设备与音箱同账号同平台。\n步骤 4：语音控制测试，如「打开客厅灯」「空调调到 26 度」。\n步骤 5：高级设置可创建场景与定时任务。\n跨平台设备兼容性建议参考手册。"

    tag: 装机-智能家居
    quality_score: 0.93

  - user: "智能摄像头怎么安装？"
    assistant: "根据描述，您需要安装智能摄像头。建议按以下步骤操作：\n步骤 1：选择安装位置，确保有电源与 WiFi 信号覆盖。\n步骤 2：通电后下载对应 App，扫码添加设备。\n步骤 3：按提示连接 WiFi（建议仅支持 2.4G）。\n步骤 4：调整摄像头角度，App 内查看画面确认覆盖区域。\n步骤 5：如需存储，插入 TF 卡或开通云存储。\n户外安装建议选防水型号，参考手册确认防护等级。"
    tag: 装机-智能家居
    quality_score: 0.92

  - user: "NAS 怎么搭建私有云？"
    assistant: "根据描述，您需要搭建 NAS 私有云。建议按以下步骤操作：\n步骤 1：硬件准备。安装硬盘（建议 NAS 专用盘如西数红盘/希捷酷狼），插入 NAS 盘位。\n步骤 2：初始化。接通电源，电脑访问 NAS 管理地址，按向导创建存储池与卷（建议 RAID 1 或 RAID 5）。\n步骤 3：创建共享文件夹。设置访问权限与用户账号。\n步骤 4：远程访问。配置 DDNS 或 QuickConnect，实现外网访问。\n数据安全建议参考手册，重要数据建议多重备份。"
    tag: 装机-NAS 搭建
    quality_score: 0.94

  - user: "NAS 数据怎么备份？"
    assistant: "根据描述，您需要配置 NAS 数据备份。建议按以下方案操作：\n方案 1：RAID 冗余。RAID 1 镜像备份（2 盘互备），RAID 5 奇偶校验（3 盘以上）。\n方案 2：快照备份。定期创建快照，可回滚误删数据。\n方案 3：异地备份。NAS 间同步（如群晖 Hyper Backup），备份至另一台 NAS 或云存储。\n方案 4：外接存储。定期备份至移动硬盘离线保存。\n3-2-1 原则：3 份数据，2 种介质，1 份异地。详细操作建议参考手册。"
    tag: 装机-NAS 搭建
    quality_score: 0.93

