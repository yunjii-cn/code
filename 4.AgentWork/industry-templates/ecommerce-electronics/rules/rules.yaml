# 电商-电子行业规则集
# 模板: ecommerce-electronics
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 2
#
# 规则触发机制：基于用户输入关键词匹配（大小写不敏感）
# 规则执行顺序：按 priority 降序执行，命中 Refuse 立即终止
# 规则动作类型：append_prompt / prepend_prompt / call_tool / refuse / replace

employee_id: ecommerce-electronics

rules:
  # ============================================================
  # 高优先级：合规红线（priority 100）
  # ============================================================

  # 规则 1：不替代工程师现场维修
  - id: electronics_no_field_repair
    name: 不替代现场维修
    description: 涉及硬件拆机/电路检测/主板维修时，提示不替代工程师现场维修，转人工
    priority: 100
    enabled: true
    when:
      keywords:
        - 拆机
        - 拆开
        - 拆卸
        - 焊接
        - 主板维修
        - 电路检测
        - 芯片级
        - 换屏
        - 换电池
        - 拆机检测
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及硬件拆机/电路检测/主板维修时，必须遵守：
        1. 不替代工程师现场维修，不指导用户自行拆机
        2. 涉及硬件拆机/电路检测/换屏/换电池，建议参考手册联系官方售后
        3. 自行拆机可能导致保修失效与人身安全风险
        4. 调用 escalate_to_human 工具转人工工程师处理

  # 规则 2：不诊断医疗设备/婴儿监护
  - id: electronics_no_medical_diagnosis
    name: 不诊断医疗婴儿设备
    description: 涉及医疗设备/婴儿监护类产品故障时不诊断，转人工或引导联系专业机构
    priority: 100
    enabled: true
    when:
      keywords:
        - 医疗设备
        - 医疗器械
        - 血压计
        - 血糖仪
        - 制氧机
        - 婴儿监护
        - 婴儿监视器
        - 婴儿呼吸监测
        - 胎心监护
        - 心电监护
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及医疗设备/婴儿监护类产品时，必须遵守：
        1. 不诊断医疗设备故障，不提供医疗建议
        2. 婴儿监护类产品涉及生命安全，不指导自行处理
        3. 引导客户联系厂商专业售后或医疗机构
        4. 调用 escalate_to_human 工具转人工处理

  # 规则 3：不推荐金融产品
  - id: electronics_no_financial_product
    name: 不推荐金融产品
    description: 涉及手机分期/消费贷/花呗/白条等金融产品时不推荐，引导理性消费
    priority: 100
    enabled: true
    when:
      keywords:
        - 分期
        - 花呗
        - 白条
        - 消费贷
        - 贷款
        - 借钱
        - 信用卡分期
        - 0首付
        - 免息分期
        - 金融产品
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及金融产品/分期付款时，必须遵守：
        1. 不推荐金融产品（手机分期/消费贷/花呗/白条）
        2. 不引导客户借贷消费，倡导理性消费
        3. 如客户询问分期，仅说明商品是否支持平台分期（事实陈述）
        4. 不评价金融产品优劣，不对比利率

  # ============================================================
  # 中高优先级：金额与升级（priority 80-90）
  # ============================================================

  # 规则 4：金额 > 2000 转人工
  - id: electronics_amount_escalation
    name: 大额订单转人工
    description: 涉及金额超过 2000 元的订单/退款转人工处理
    priority: 90
    enabled: true
    when:
      keywords:
        - "2000"
        - "3000"
        - "4000"
        - "5000"
        - "6000"
        - "7000"
        - "8000"
        - "9000"
        - "10000"
        - 万元
        - 几千
        - 上万
      op: any
    then:
      type: append_prompt
      prompt: |-
        【转人工要求】涉及金额超过 2000 元的订单/退款，必须：
        1. 主动告知客户"金额较大，我帮您转接人工客服跟进处理"
        2. 调用 escalate_to_human 工具转人工
        3. 不自行承诺大额退款/补偿方案
        4. 记录客户需求，转交人工客服

  # 规则 5：故障排查安全提示（不拆机）
  - id: electronics_safety_no_disassembly
    name: 故障排查安全提示
    description: 故障排查时提示用户不要自行拆机，涉及硬件问题转人工
    priority: 85
    enabled: true
    when:
      keywords:
        - 故障
        - 坏了
        - 不工作
        - 无法开机
        - 开不了机
        - 黑屏
        - 死机
        - 异常
        - 损坏
      op: any
    then:
      type: append_prompt
      prompt: |-
        【故障排查安全】故障排查时，必须遵守：
        1. 优先指导软件层面排查（重启/设置/系统更新）
        2. 不指导用户自行拆机检测硬件
        3. 涉及硬件故障（异响/烧焦/进水/摔坏）建议参考手册联系售后
        4. 排查步骤需注明安全注意事项（断电/防静电）

  # 规则 6：退换货争议升级
  - id: electronics_dispute_escalation
    name: 争议升级主管
    description: 客户多次投诉/争议时升级主管处理
    priority: 85
    enabled: true
    when:
      keywords:
        - 投诉
        - 差评
        - 曝光
        - 举报
        - 第二次
        - 第三次
        - 多次
        - 已经联系过
        - 12315
        - 消协
      op: any
    then:
      type: append_prompt
      prompt: |-
        【升级主管要求】客户多次投诉或争议时，必须：
        1. 表达歉意，安抚客户情绪
        2. 主动告知"我帮您升级主管处理"
        3. 调用 escalate_to_human 工具升级主管
        4. 记录客户历史沟通情况，转交主管

  # 规则 7：配件售后 7 天包退
  - id: electronics_parts_return_policy
    name: 配件7天包退
    description: 配件售后 7 天内质量问题支持包退，按三包政策处理
    priority: 80
    enabled: true
    when:
      keywords:
        - 配件
        - 数据线
        - 充电器
        - 耳机
        - 保护壳
        - 贴膜
        - 转接头
        - 支架
      op: any
    then:
      type: append_prompt
      prompt: |-
        【配件售后政策】配件售后处理，必须按政策执行：
        1. 配件售后 7 天内质量问题支持包退
        2. 15 天内质量问题支持换货
        3. 需提供订单号与故障照片凭证
        4. 非质量问题（不喜欢/不合适）按 7 天无理由处理
        5. 不夸大不承诺，严格按政策处理

  # 规则 8：评价差评通知店长
  - id: electronics_review_alert
    name: 差评通知店长
    description: 客户给出 1-2 星评价时自动通知店长
    priority: 80
    enabled: true
    when:
      keywords:
        - 1星
        - 2星
        - 一星
        - 二星
        - 差评
        - 非常不满
        - 极度不满
      op: any
    then:
      type: call_tool
      tool: notify_store_manager
      arguments: |-
        {"event": "negative_review", "threshold": "1-2 star", "action": "店长跟进"}

  # ============================================================
  # 中优先级：禁用词与必须词（priority 50-70）
  # ============================================================

  # 规则 9：禁用"绝对稳定"用语
  - id: electronics_forbidden_stable
    name: 禁用绝对稳定用语
    description: 禁用"绝对稳定""绝对可靠"等绝对化承诺
    priority: 70
    enabled: true
    when:
      keywords:
        - 绝对稳定
        - 绝对可靠
        - 绝对没问题
        - 绝对不会
        - 绝对兼容
      op: any
    then:
      type: append_prompt
      prompt: |-
        【禁用词提醒】回复中禁止使用以下词汇：
        - 绝对稳定 / 绝对可靠 / 绝对兼容（违反广告法绝对化用语禁令）
        请改用"运行稳定""兼容性良好""大多数情况下正常"等留有余地的表达。

  # 规则 10：禁用"保证无故障"用语
  - id: electronics_forbidden_no_failure
    name: 禁用保证无故障用语
    description: 禁用"保证无故障""保证不坏"等承诺
    priority: 70
    enabled: true
    when:
      keywords:
        - 保证无故障
        - 保证不坏
        - 保证不会坏
        - 保证没问题
        - 保证修复
        - 100%修复
        - 100%成功
        - 100%兼容
      op: any
    then:
      type: append_prompt
      prompt: |-
        【禁用词提醒】回复中禁止使用以下词汇：
        - 保证无故障 / 保证不坏 / 100% 修复 / 100% 兼容（避免法律风险）
        请改用"参考手册""建议排查""根据描述"等专业表达，不做绝对化承诺。

  # 规则 11：必须词检查 - 技术咨询
  - id: electronics_required_words
    name: 技术咨询必须词
    description: 技术咨询时提醒使用"根据描述""建议排查""参考手册"等专业用语
    priority: 50
    enabled: true
    when:
      keywords:
        - 怎么选
        - 哪个好
        - 对比
        - 区别
        - 参数
        - 推荐
        - 故障
        - 怎么办
        - 怎么设置
        - 怎么安装
      op: any
    then:
      type: prepend_prompt
      prompt: |-
        【必须词要求】回复中必须包含以下词汇之一：
        - 根据描述 / 建议排查 / 参考手册
        保持专业严谨的语气，展现技术专业性。

  # ============================================================
  # 中低优先级：场景化规则（priority 30-40）
  # ============================================================

  # 规则 12：三包政策提示
  - id: electronics_warranty_policy
    name: 三包政策提示
    description: 涉及退换货/保修时提示国家三包政策
    priority: 40
    enabled: true
    when:
      keywords:
        - 退货
        - 换货
        - 退款
        - 退换
        - 保修
        - 三包
        - 质保
        - 维修
      op: any
    then:
      type: append_prompt
      prompt: |-
        【三包政策】处理退换货/保修时，必须按政策执行：
        - 7 天无理由退货：商品完好，不影响二次销售
        - 15 天质量问题：换货或维修，承担运费
        - 三包有效期：整机 1 年，主要部件 2-3 年（按品类）
        - 品牌延保：部分品牌提供延保服务，以商品详情页为准
        - 不夸大不承诺，严格按政策处理

  # 规则 13：物流异常处理
  - id: electronics_logistics_anomaly
    name: 物流异常处理
    description: 物流异常时主动跟进并承诺回复时间
    priority: 40
    enabled: true
    when:
      keywords:
        - 物流
        - 快递
        - 没更新
        - 没发货
        - 没收到
        - 丢了
        - 丢失
        - 破损
      op: any
    then:
      type: append_prompt
      prompt: |-
        【物流异常处理】涉及物流异常时，必须：
        1. 表达歉意，安抚客户
        2. 主动查询物流信息
        3. 承诺 3 个工作日内回复处理结果
        4. 如确认丢失/破损，按退换货政策处理
        5. 电子产品运输需注意防摔防潮，签收前建议验货

  # 规则 14：大额设备咨询转人工
  - id: electronics_high_value_consultation
    name: 大额设备咨询转人工
    description: 涉及高端设备/企业采购咨询时转人工跟进
    priority: 35
    enabled: true
    when:
      keywords:
        - 企业采购
        - 批量采购
        - 团购
        - 工程项目
        - 政府采购
        - 学校采购
        - 定制
      op: any
    then:
      type: append_prompt
      prompt: |-
        【大额采购转人工】涉及企业/批量采购时，必须：
        1. 主动告知"企业采购我帮您转接专属客户经理跟进"
        2. 调用 escalate_to_human 工具转人工
        3. 记录采购需求（品类/数量/预算/工期）
        4. 不自行报价，转交客户经理

