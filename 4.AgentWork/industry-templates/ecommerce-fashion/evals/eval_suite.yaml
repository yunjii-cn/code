# 电商-穿搭行业评估套件
# 模板: ecommerce-fashion
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 1
#
# 评估方式：LLM-as-Judge + 约束检查
# 评分维度：风格 / 相关性 / 约束 / 总分（0-10）
# 通过标准：总分 >= 6.0 且无约束违规

# 套件 ID
id: ecommerce_fashion_eval_v1

# 套件名称
name: 电商-穿搭行业评估套件

# 所属员工 ID
employee_id: fashion_stylist

# 场景描述
scenario: 电商穿搭客服

# 版本号
version: 1.0.0

# 创建时间
created_at: 2026-06-19

# 评估用例列表（22 条）
cases:
  # ============================================================
  # 售前 - 尺码推荐（5 条）
  # ============================================================

  - id: eval_001
    input: "我身高 165 体重 110，这件连衣裙穿什么码？"
    rubric: |-
      正确推荐尺码（M 码），说明版型特点，主动询问风格偏好。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，根据您的身高体重，建议选 M 码哦~ 这款连衣裙版型偏宽松，M 码穿着舒适又有型。请问您平时喜欢修身还是宽松的风格呢？"
    weight: 1.0
    category: 售前-尺码推荐
    notes: 基础尺码咨询

  - id: eval_002
    input: "我比较胖，140 斤能穿吗？"
    rubric: |-
      正确推荐大码（XXL），说明适合体重范围，提示 7 天无理由换货。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      不歧视客户体型，语气友好。
    expected_output: "亲，完全可以的~ 请问您身高多少呢？我们这款有 XL-XXL 码，XXL 码适合 130-150 斤的姐妹。建议您选 XXL 码，穿着舒适不紧绷。"
    weight: 1.2
    category: 售前-尺码推荐
    notes: 大码客户咨询，需特别注意语气

  - id: eval_003
    input: "鞋子尺码偏大还是偏小？"
    rubric: |-
      正确说明尺码是否标准，给出选码建议（脚宽选大半码）。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，这款鞋子尺码标准，不偏大不偏小哦~ 建议按平时穿的尺码下单。如果您脚型偏宽或偏胖，建议选大半码更舒适。"
    weight: 1.0
    category: 售前-尺码推荐
    notes: 鞋类尺码咨询

  - id: eval_004
    input: "童装 110 码适合多大孩子？"
    rubric: |-
      正确说明适合年龄（3-4 岁）和身高（100-110cm），建议偏高偏胖选大一码。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，110 码适合 3-4 岁的宝宝，身高 100-110cm 左右哦~ 如果宝宝偏高或偏胖，建议选大一码 120 码。"
    weight: 1.0
    category: 售前-尺码推荐
    notes: 童装尺码咨询

  - id: eval_005
    input: "裤子腰围 80 选什么码？"
    rubric: |-
      正确推荐码数（L 或 XL），说明各码腰围范围，询问臀围综合推荐。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，腰围 80cm 建议选 L 码或 XL 码哦~ 这款裤子 L 码腰围 78-82cm，XL 码腰围 82-86cm。"
    weight: 1.0
    category: 售前-尺码推荐
    notes: 裤装腰围咨询

  # ============================================================
  # 售前 - 风格/场景搭配（5 条）
  # ============================================================

  - id: eval_006
    input: "下周要参加朋友婚礼，有什么推荐？"
    rubric: |-
      主动询问婚礼风格和色系偏好，提供 2+ 套搭配方案（连衣裙/套装）。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      不夸大功效。
    expected_output: "亲，参加婚礼穿搭要得体又出彩呢~ 请问婚礼是什么风格？我给您推荐几套搭配方案：1) 香槟色连衣裙 + 高跟鞋；2) 浅粉色套装 + 单鞋。"
    weight: 1.5
    category: 售前-场景搭配
    notes: 婚礼场景，需提供具体方案

  - id: eval_007
    input: "通勤穿什么显得专业？"
    rubric: |-
      提供 2+ 套通勤搭配方案（衬衫/针织衫/西装），询问公司着装要求。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，通勤穿搭要专业又不失时尚~ 推荐：1) 白衬衫 + 西裤；2) 针织衫 + 半裙；3) 西装外套 + 连衣裙。"
    weight: 1.2
    category: 售前-场景搭配
    notes: 通勤场景

  - id: eval_008
    input: "约会穿什么比较好看？"
    rubric: |-
      询问约会场景，提供 2+ 套搭配方案（连衣裙/针织裙/半身裙）。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，约会穿搭要美美的~ 推荐：1) 碎花连衣裙 + 小白鞋；2) 针织裙 + 长靴；3) 半身裙 + 毛衣。"
    weight: 1.0
    category: 售前-场景搭配
    notes: 约会场景

  - id: eval_009
    input: "这件上衣怎么搭配？"
    rubric: |-
      提供 2+ 种搭配方案（牛仔裤/半裙/西裤），询问搭配场景。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，这件上衣很百搭哦~ 推荐：1) 配牛仔裤 + 小白鞋；2) 配半裙 + 高跟鞋；3) 配西裤 + 乐福鞋。"
    weight: 1.0
    category: 售前-场景搭配
    notes: 单品搭配咨询

  - id: eval_010
    input: "度假穿什么？"
    rubric: |-
      提供 2+ 套度假搭配方案（连衣裙/阔腿裤/半身裙），询问度假地点。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，度假穿搭要轻松又出片~ 推荐：1) 碎花连衣裙 + 草帽；2) 阔腿裤 + 吊带；3) 半身裙 + T 恤。"
    weight: 1.0
    category: 售前-场景搭配
    notes: 度假场景

  # ============================================================
  # 售前 - 面料咨询（3 条，含合规检查）
  # ============================================================

  - id: eval_011
    input: "这件衣服是什么面料的？"
    rubric: |-
      正确介绍面料成分（如 95% 棉 + 5% 氨纶），引导参考水洗标。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      不承诺面料成分（合规重点）。
    expected_output: "亲，这款是 95% 棉 + 5% 氨纶的面料哦~ 具体的成分比例可以参考商品详情页的水洗标。"
    weight: 1.3
    category: 售前-面料咨询
    notes: 合规重点 - 不承诺面料

  - id: eval_012
    input: "是真丝的吗？"
    rubric: |-
      如实说明面料（仿真丝/真丝），不夸大不冒充。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      不承诺面料成分（合规重点）。
    expected_output: "亲，这款是仿真丝面料（聚酯纤维），不是真丝哦~ 仿真丝手感丝滑、垂感好，价格更亲民。"
    weight: 1.5
    category: 售前-面料咨询
    notes: 合规重点 - 不冒充真丝

  - id: eval_013
    input: "你能保证这是 100% 纯棉吗？"
    rubric: |-
      不承诺 100% 纯棉，引导参考水洗标。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""保证正品"等词。
      不承诺面料成分（合规红线）。
    expected_output: "亲，这款标注是 100% 棉，具体的成分比例可以参考商品水洗标哦~ 我们不替消费者做鉴定，建议您参考水洗标或联系第三方检测。"
    weight: 2.0
    category: 售前-面料咨询
    notes: 合规红线 - 不承诺面料成分

  # ============================================================
  # 售后 - 尺码问题（3 条）
  # ============================================================

  - id: eval_014
    input: "我收到的衣服尺码偏小了，能换吗？"
    rubric: |-
      说明 7 天内可换货，询问订单号和想换的尺码，提示运费承担。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，非常抱歉给您带来不便~ 7 天内是可以换货的哦，请您提供一下订单号，我帮您安排换货流程。请问您想换什么尺码呢？"
    weight: 1.3
    category: 售后-尺码问题
    notes: 尺码换货

  - id: eval_015
    input: "衣服尺码买大了，能换小一码吗？"
    rubric: |-
      说明 7 天内可换货，确认商品未洗涤未穿着吊牌完整。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，7 天内是可以换货的哦~ 请您确保商品未洗涤未穿着，吊牌完整，我帮您安排换货流程。请问您想换什么尺码呢？"
    weight: 1.2
    category: 售后-尺码问题
    notes: 尺码换货

  - id: eval_016
    input: "我穿了才发现尺码不合适，还能换吗？"
    rubric: |-
      说明退换货政策（未洗涤未穿着吊牌完整），如已穿着按政策处理。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      不夸大不承诺。
    expected_output: "亲，7 天无理由退换货需要商品未洗涤未穿着，吊牌完整哦~ 如果已经穿着过，可能无法办理退换。请您提供订单号，我帮您确认具体情况。"
    weight: 1.5
    category: 售后-尺码问题
    notes: 已穿着商品退换

  # ============================================================
  # 售后 - 质量问题（3 条）
  # ============================================================

  - id: eval_017
    input: "衣服有破损，怎么办？"
    rubric: |-
      表达歉意，要求拍照，说明 15 天质量问题全额退款承担运费。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，非常抱歉收到破损商品给您带来困扰~ 请您拍几张破损照片发给我，我帮您加急处理退款。15 天内质量问题我们全额退款并承担运费。"
    weight: 1.5
    category: 售后-质量问题
    notes: 破损商品处理

  - id: eval_018
    input: "衣服脱线了，质量太差了！"
    rubric: |-
      表达歉意，要求拍照，说明 15 天质量问题处理方案。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
      安抚客户情绪。
    expected_output: "亲，非常抱歉给您带来不好的体验~ 请您拍几张脱线照片发给我，我帮您加急处理。15 天内质量问题我们全额退款并承担运费，请您放心。"
    weight: 1.5
    category: 售后-质量问题
    notes: 质量问题+情绪安抚

  - id: eval_019
    input: "色差太大了，和图片完全不一样！"
    rubric: |-
      表达歉意，说明色差原因（显示器/拍摄），提供退换货方案。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，非常抱歉色差给您带来困扰~ 由于显示器和拍摄光线原因可能存在轻微色差。如果您不满意，7 天内可以退换货，我帮您安排。"
    weight: 1.3
    category: 售后-质量问题
    notes: 色差问题

  # ============================================================
  # 售后 - 物流延迟（2 条）
  # ============================================================

  - id: eval_020
    input: "我的订单物流一直没更新，怎么办？"
    rubric: |-
      表达歉意，要求提供订单号，承诺 3 个工作日内回复。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，让您久等了，非常抱歉~ 请您提供一下订单号，我马上帮您查询物流情况。一般物流异常我们会联系快递公司跟进，3 个工作日内给您回复处理结果。"
    weight: 1.2
    category: 售后-物流延迟
    notes: 物流异常

  - id: eval_021
    input: "快递显示签收了但我没收到！"
    rubric: |-
      建议检查快递柜/门卫/代收点，承诺联系快递核实，3 个工作日回复。
      必须包含"亲"或"请问"或"感谢您的支持"。
      禁用"绝对""100%""最便宜"等词。
    expected_output: "亲，非常抱歉给您带来困扰~ 请您先检查一下快递柜、门卫室或代收点。如果确实没收到，请您提供订单号，我帮您联系快递公司核实，3 个工作日内给您回复。"
    weight: 1.3
    category: 售后-物流延迟
    notes: 签收未收到

  # ============================================================
  # 内容生成 - 小红书种草（1 条）
  # ============================================================

  - id: eval_022
    input: "帮我写一条小红书种草文，推这款春季新款连衣裙"
    rubric: |-
      生成小红书风格种草文，包含标题、正文、emoji、标签。
      风格活泼有吸引力，但不夸大功效。
      不使用"最便宜""绝对""保证正品"等禁用词。
      包含商品信息（尺码/场景/搭配建议）。
    expected_output: "标题：🌸春日必备！这条连衣裙让我美到犯规✨\n\n正文：姐妹们！春天来了...（含搭配建议和标签）"
    weight: 1.5
    category: 内容-小红书种草
    notes: 内容生成能力评估

# 自定义元数据
metadata:
  template_id: ecommerce-fashion
  total_cases: 22
  category_breakdown:
    售前-尺码推荐: 5
