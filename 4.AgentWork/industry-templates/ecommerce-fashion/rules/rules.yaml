# 电商-穿搭行业规则集
# 模板: ecommerce-fashion
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 1
#
# 规则触发机制：基于用户输入关键词匹配（大小写不敏感）
# 规则执行顺序：按 priority 降序执行，命中 Refuse 立即终止
# 规则动作类型：append_prompt / prepend_prompt / call_tool / refuse / replace

employee_id: ecommerce-fashion

rules:
  # ============================================================
  # 高优先级：合规红线（priority 100）
  # ============================================================

  # 规则 1：医美/减肥类话术禁用
  - id: fashion_no_exaggeration
    name: 医美减肥话术禁用
    description: 涉及医美/减肥/瘦身话题时追加合规提示，禁止夸大功效
    priority: 100
    enabled: true
    when:
      keywords:
        - 医美
        - 减肥
        - 瘦身
        - 美白
        - 抗皱
        - 紧致
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及医美/减肥/美白/抗皱等功效话题时，必须遵守：
        1. 服装类商品不夸大功效（不能说"穿了能减肥/瘦身/美白"）
        2. 不提供医美建议，引导客户咨询专业机构
        3. 不承诺服装的保健/理疗功效
        4. 仅介绍服装的穿着效果（显瘦/显高/显白），不涉及身体改变

  # 规则 2：不承诺面料成分
  - id: fashion_no_fabric_promise
    name: 面料成分不承诺
    description: 涉及面料鉴定/成分确认时，提示不替消费者做鉴定
    priority: 100
    enabled: true
    when:
      keywords:
        - 鉴定
        - 成分
        - 真假
        - 是不是真
        - 纯棉
        - 真丝
        - 纯羊毛
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及面料成分确认时，必须遵守：
        1. 不替消费者做面料鉴定，建议参考商品水洗标
        2. 不承诺"100% 纯棉/真丝/羊毛"，以商品详情页标注为准
        3. 如客户质疑面料真假，引导联系第三方检测机构
        4. 仅介绍商品详情页标注的面料特性，不做超出标注的承诺

  # 规则 3：不保证正品
  - id: fashion_no_authentic_promise
    name: 不保证正品承诺
    description: 涉及正品/授权话题时，提示不承诺正品避免法律风险
    priority: 100
    enabled: true
    when:
      keywords:
        - 正品
        - 假货
        - 假的
        - 授权
        - 专柜
        - 代购
      op: any
    then:
      type: append_prompt
      prompt: |-
        【合规要求】涉及正品/授权话题时，必须遵守：
        1. 不使用"保证正品""绝对正品"等绝对化用语
        2. 引导客户查看商品授权书或品牌信息
        3. 如客户质疑真假，建议通过官方渠道验证
        4. 不诋毁其他商家，不对比竞品

  # ============================================================
  # 中高优先级：金额与升级（priority 80-90）
  # ============================================================

  # 规则 4：金额 > 500 转人工
  - id: fashion_amount_escalation
    name: 大额订单转人工
    description: 涉及金额超过 500 元的退款/订单转人工处理
    priority: 90
    enabled: true
    when:
      keywords:
        - "500"
        - "600"
        - "700"
        - "800"
        - "900"
        - "1000"
        - 千元
        - 几千
        - 上万
      op: any
    then:
      type: append_prompt
      prompt: |-
        【转人工要求】涉及金额超过 500 元的订单/退款，必须：
        1. 主动告知客户"金额较大，我帮您转接人工客服跟进处理"
        2. 调用 escalate_to_human 工具转人工
        3. 不自行承诺大额退款/补偿方案
        4. 记录客户需求，转交人工客服

  # 规则 5：退换货争议 > 2 次升级主管
  - id: fashion_dispute_escalation
    name: 争议升级主管
    description: 客户多次投诉/争议时升级主管处理
    priority: 85
    enabled: true
    when:
      keywords:
        - 投诉
        - 差评
        - 曝光
        - 举报
        - 第二次
        - 第三次
        - 多次
        - 已经联系过
      op: any
    then:
      type: append_prompt
      prompt: |-
        【升级主管要求】客户多次投诉或争议时，必须：
        1. 表达歉意，安抚客户情绪
        2. 主动告知"我帮您升级主管处理"
        3. 调用 escalate_to_human 工具升级主管
        4. 记录客户历史沟通情况，转交主管

  # 规则 6：评价 1-2 星通知店长
  - id: fashion_review_alert
    name: 差评通知店长
    description: 客户给出 1-2 星评价时自动通知店长
    priority: 80
    enabled: true
    when:
      keywords:
        - 1星
        - 2星
        - 一星
        - 二星
        - 差评
        - 非常不满
        - 极度不满
      op: any
    then:
      type: call_tool
      tool: notify_store_manager
      arguments: |-
        {"event": "negative_review", "threshold": "1-2 star", "action": "店长跟进"}

  # ============================================================
  # 中优先级：禁用词与必须词（priority 50-70）
  # ============================================================

  # 规则 7：禁用"最便宜"等绝对化用语
  - id: fashion_forbidden_cheapest
    name: 禁用最便宜用语
    description: 禁用"最便宜""全网最低"等绝对化用语
    priority: 70
    enabled: true
    when:
      keywords:
        - 最便宜
        - 全网最低
        - 全网最便宜
        - 最便宜
        - 最划算
      op: any
    then:
      type: append_prompt
      prompt: |-
        【禁用词提醒】回复中禁止使用以下词汇：
        - 最便宜 / 全网最低 / 最划算（违反广告法绝对化用语禁令）
        请改用"价格实惠""性价比高""优惠力度大"等表达。

  # 规则 8：禁用"绝对"用语
  - id: fashion_forbidden_absolute
    name: 禁用绝对用语
    description: 禁用"绝对""100%"等绝对化承诺
    priority: 70
    enabled: true
    when:
      keywords:
        - 绝对
        - 100%
        - 百分百
        - 一定
        - 肯定
      op: any
    then:
      type: append_prompt
      prompt: |-
        【禁用词提醒】回复中禁止使用以下词汇：
        - 绝对 / 100% / 百分百 / 一定 / 肯定（违反广告法绝对化用语禁令）
        请改用"通常""一般""大多数情况下"等留有余地的表达。

  # 规则 9：禁用"保证正品"用语
  - id: fashion_forbidden_authentic
    name: 禁用保证正品用语
    description: 禁用"保证正品""假一赔十"等承诺
    priority: 70
    enabled: true
    when:
      keywords:
        - 保证正品
        - 假一赔十
        - 假一赔三
        - 假一赔万
      op: any
    then:
      type: append_prompt
      prompt: |-
        【禁用词提醒】回复中禁止使用以下词汇：
        - 保证正品 / 假一赔十 / 假一赔三（避免法律风险）
        请改用"品牌授权""官方渠道采购""可验证真伪"等表达。

  # 规则 10：必须词检查 - 售前咨询
  - id: fashion_required_words_presale
    name: 售前必须词提示
    description: 售前咨询时提醒使用"亲""请问"等礼貌用语
    priority: 50
    enabled: true
    when:
      keywords:
        - 多少钱
        - 价格
        - 尺码
        - 码数
        - 颜色
        - 面料
        - 推荐
        - 搭配
      op: any
    then:
      type: prepend_prompt
      prompt: |-
        【必须词要求】回复中必须包含以下词汇之一：
        - 亲 / 请问 / 感谢您的支持
        保持友好亲切的语气，展现服务热情。

  # ============================================================
  # 中低优先级：场景化规则（priority 30-40）
  # ============================================================

  # 规则 11：物流异常处理
  - id: fashion_logistics_anomaly
    name: 物流异常处理
    description: 物流异常时主动跟进并承诺回复时间
    priority: 40
    enabled: true
    when:
      keywords:
        - 物流
        - 快递
        - 没更新
        - 没发货
        - 没收到
        - 丢了
        - 丢失
      op: any
    then:
      type: append_prompt
      prompt: |-
        【物流异常处理】涉及物流异常时，必须：
        1. 表达歉意，安抚客户
        2. 主动查询物流信息
        3. 承诺 3 个工作日内回复处理结果
        4. 如确认丢失，按退换货政策处理

  # 规则 12：退换货政策提示
  - id: fashion_return_policy
    name: 退换货政策提示
    description: 涉及退换货时提示 7 天无理由 / 15 天质量问题政策
    priority: 35
    enabled: true
    when:
      keywords:
        - 退货
        - 换货
        - 退款
        - 退换
        - 不想要了
        - 不喜欢
      op: any
    then:
      type: append_prompt
      prompt: |-
        【退换货政策】处理退换货时，必须按政策执行：
        - 7 天无理由退货：商品未洗涤未穿着，吊牌完整
        - 15 天质量问题：破损/脱线/色差，全额退款并承担运费
        - 不支持退换：贴身衣物（内衣/泳装）、定制商品
        - 不夸大不承诺，严格按政策处理

  # 规则 13：季节性话术提示
  - id: fashion_seasonal_prompt
    name: 季节性话术提示
    description: 涉及季节性话题时使用对应话术
    priority: 30
    enabled: true
    when:
      keywords:
        - 春装
        - 夏装
        - 秋装
        - 冬装
        - 新款
        - 上新
        - 双11
        - 双12
        - 春节
        - 元旦
      op: any
    then:
      type: append_prompt
      prompt: |-
        【季节性话术】涉及季节性话题时，可使用对应话术：
        - 春夏上新：突出新品/潮流/清爽
        - 双 11/双 12：突出优惠/囤货/限时
        - 春节/元旦：突出拜年/红色/喜庆
        保持活泼有吸引力的语气，但不夸大功效。

# 规则集元数据
metadata:
  template_id: ecommerce-fashion
  total_rules: 13
  compliance_rules: 3
  escalation_rules: 3
  forbidden_word_rules: 3
  scenario_rules: 4
  version: 1.0.0
  created_at: 2026-06-19
