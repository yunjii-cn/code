    input: "孩子画画总是乱涂乱画怎么办？"
    rubric: |-
      说明"乱涂乱画"是4-6岁涂鸦期的正常表现。
      提供非评判建议（不纠正"画得不像"/提供多种材料/多看绘本/展示作品）。
      必须包含"建议尝试"或"根据兴趣"或"因材施教"或"每个孩子都有独特创造力"。
      禁用"必须""应该""不然就晚了"等焦虑词。
      禁用"没天赋""不是这块料"等伤人表达。
    expected_output: "理解您的困扰~ 其实"乱涂乱画"是这个年龄段的正常表现哦！根据兴趣，4-6岁孩子处于涂鸦期，"乱画"正是他们探索和表达的方式。建议：1) 不要纠正"画得不像"，鼓励孩子讲讲画里的故事；2) 提供多种材料让孩子尝试。每个孩子都有独特创造力，因材施教，从"乱画"到"有意识画"需要时间。建议尝试我们的创意儿童画体验课~"
