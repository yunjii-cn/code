# 教育-素质培训行业评估套件
# 模板: education-arts-training
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 4
#
# 评估方式：LLM-as-Judge + 约束检查
# 评分维度：风格 / 相关性 / 约束 / 总分（0-10）
# 通过标准：总分 >= 6.0 且无约束违规
# ⚠️ 合规红线：不替代真人教师 / 不评判天赋 / 考级非保过 / 退款按合同

# 套件 ID
id: education_arts_training_eval_v1

# 套件名称
name: 教育-素质培训行业评估套件

# 所属员工 ID
employee_id: arts_advisor

# 场景描述
scenario: 素质教育培训咨询

# 版本号
version: 1.0.0

# 创建时间
created_at: 2026-06-19

# 评估用例列表（22 条）
cases:
  # ============================================================
  # 顾问 - AI启蒙课程咨询（4 条）
  # ============================================================

  - id: eval_001
    input: "我家孩子7岁，想学编程，有什么体验课推荐？"
    rubric: |-
      根据年龄推荐Scratch图形化编程（适合7-9岁）。
      说明课程内容价值（拖拽积木做动画/游戏），不焦虑营销。
      必须包含"建议尝试"或"根据兴趣"或"因材施教"或"每个孩子都有独特创造力"。
      禁用"必须""应该""不然就晚了""错过""关键期"等焦虑词。
      禁用"没天赋""不是这块料"等伤人表达。
      尊重家长选择，不强推。
    expected_output: "您好~ 7岁正是启蒙编程的好阶段呢！根据兴趣，7岁孩子适合从Scratch图形化编程入门，通过拖拽积木块就能做出有趣的小动画和小游戏，特别能激发创造力。我们有一节免费的Scratch体验课，老师会带着孩子做一个"小猫追球"的小作品。每个孩子都有独特创造力，建议尝试一下看看孩子的兴趣。"
    weight: 1.5
    category: 顾问-AI启蒙
    notes: 基础AI启蒙咨询，需适龄推荐

  - id: eval_002
    input: "孩子几岁可以开始学编程？"
    rubric: |-
      分年龄段说明编程入门方式（4-6岁无屏幕/7-9岁Scratch/10-12岁Python/13岁以上LLM）。
      必须包含"建议尝试"或"根据兴趣"或"因材施教"或"每个孩子都有独特创造力"。
      禁用"必须""应该""不然就晚了"等焦虑词。
      禁用"没天赋""不是这块料"等伤人表达。
      强调根据孩子兴趣和认知发展选择。
    expected_output: "好问题~ 根据兴趣，不同年龄段适合不同的编程入门方式：1) 4-6岁：可以玩无屏幕编程玩具，培养逻辑思维；2) 7-9岁：适合Scratch图形化编程；3) 10-12岁：可以尝试Python入门；4) 13岁以上：可以学Python进阶或LLM基础。每个孩子都有独特创造力，因材施教，建议根据孩子的兴趣和认知发展选择。"
    weight: 1.3
    category: 顾问-AI启蒙
    notes: 编程适龄咨询

  - id: eval_003
    input: "Scratch和Python有什么区别？"
    rubric: |-
      正确说明Scratch是图形化编程（拖拽积木，7-9岁），Python是文本编程（写代码，10岁以上）。
      建议先学Scratch再过渡到Python。
      必须包含"建议尝试"或"根据兴趣"或"因材施教"或"每个孩子都有独特创造力"。
      禁用"必须""应该""不然就晚了"等焦虑词。
      禁用"没天赋""不是这块料"等伤人表达。
    expected_output: "好问题~ 简单说：1) Scratch是图形化编程，像搭积木一样拖拽模块，适合7-9岁入门；2) Python是文本编程，需要写英文代码，适合10岁以上。根据兴趣，建议先学Scratch培养编程思维，再过渡到Python。每个孩子都有独特创造力，因材施教，过渡的节奏看孩子的接受程度。"
    weight: 1.2
    category: 顾问-AI启蒙
    notes: Scratch vs Python 对比

  - id: eval_004
    input: "AI启蒙课是学什么的？"
    rubric: |-
      正确介绍AI启蒙课4个模块（Scratch/Python/LLM基础/提示词工程）。
      必须包含"建议尝试"或"根据兴趣"或"因材施教"或"每个孩子都有独特创造力"。
      禁用"必须""应该""不然就晚了"等焦虑词。
      禁用"没天赋""不是这块料"等伤人表达。
      不承诺课程效果。
    expected_output: "好问题~ 我们的AI启蒙课包括4个模块：1) Scratch图形化编程；2) Python入门；3) LLM基础——科普大模型原理；4) 提示词工程——学怎么和AI对话。根据兴趣，课程由浅入深，因材施教。每个孩子都有独特创造力，我们更关注孩子在过程中的兴趣培养。建议尝试一节体验课~"
    weight: 1.3
    category: 顾问-AI启蒙
    notes: AI启蒙课程体系介绍

