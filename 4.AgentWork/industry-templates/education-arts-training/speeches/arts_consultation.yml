  - user: "Python的print是什么？"
    assistant: "好问题~ print是Python里最常用的命令，意思是"打印"——把内容显示在屏幕上。\n\n举个例子：\n```python\nprint(\"Hello, World!\")\nprint(\"我喜欢学编程\")\nprint(1 + 2)\n```\n\n运行后会显示：\nHello, World!\n我喜欢学编程\n3\n\n生活化比喻：print就像让电脑"说话"，你想让它显示什么，就把内容放在括号里。文字要用引号包起来，数字和算式不用。根据兴趣，建议尝试自己写几个print，因材施教，从感兴趣的内容开始学更容易理解~"
    tag: 辅导-Python
    quality_score: 0.95

  - user: "Python的变量是什么？"
    assistant: "好问题~ 变量就像一个"贴了标签的盒子"，用来存放数据。\n\n举个例子：\n```python\nname = \"小明\"\nage = 10\nprint(name)\nprint(age)\n```\n\n这里name和age就是变量，"="是把右边的值放进左边的盒子里。print是把这个盒子里的东西显示出来。\n\n生活化比喻：变量就像书包里的格子，一格放名字，一格放年龄，需要的时候拿出来用。根据兴趣，建议尝试自己写几个变量，比如存你喜欢的颜色、食物。每个孩子都有独特创造力，因材施教，从感兴趣的内容开始学更容易理解~"
    tag: 辅导-Python
    quality_score: 0.94

  - user: "Python的if语句怎么用？"
    assistant: "好问题~ if语句就是"如果...就..."，让程序能做判断。\n\n举个例子：\n```python\nage = 10\nif age >= 7:\n    print(\"你可以学编程啦！\")\nelse:\n    print(\"再长大一点就可以学啦~\")\n```\n\n运行后会显示"你可以学编程啦！"，因为10>=7。\n\n注意：1) if后面是条件，冒号不能少；2) 下面的代码要缩进（按Tab键）；3) else是"否则"的意思，可以不写。根据兴趣，建议尝试改age的值，看看结果有什么不同。每个孩子都有独特创造力，因材施教，想想生活中哪些事情是"如果...就..."的呢？"
    tag: 辅导-Python
