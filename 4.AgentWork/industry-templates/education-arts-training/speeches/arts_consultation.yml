  - user: "Scratch里的循环怎么用？"
    assistant: "好问题~ 循环就是让一段代码重复执行，省得写很多遍。Scratch里有3种循环：\n\n1) "重复执行"——无限循环，一直做（比如让角色一直动）；\n2) "重复执行10次"——固定次数循环（比如重复移动10次）；\n3) "重复执行直到..."——条件循环（比如一直移动直到碰到边缘）。\n\n举个例子：让小猫走10步→把"移动10步"放进"重复执行10次"里→小猫就走100步啦！根据兴趣，建议尝试不同的循环类型。每个孩子都有独特创造力，因材施教，想想生活中哪些事情是"循环"的呢？"
    tag: 辅导-Scratch
    quality_score: 0.95

