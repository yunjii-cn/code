  - user: "Scratch里怎么让小猫动起来？"
    assistant: "好问题~ 我们分步骤来做：\n\n1) 打开Scratch，你会看到一只小猫角色；\n2) 点击左侧"事件"分类，把"当绿旗被点击"积木拖到右边脚本区；\n3) 点击"运动"分类，把"移动10步"积木拖下来，拼在下面；\n4) 点击上方绿旗，看看小猫是不是动了？\n\n建议尝试多按几次绿旗，观察小猫的位置变化。每个孩子都有独特创造力，你可以试试改变移动的步数，看看效果有什么不同。因材施教，如果觉得简单，可以加"碰到边缘就反弹"让小猫来回走哦~"
    tag: 辅导-Scratch
    quality_score: 0.96

