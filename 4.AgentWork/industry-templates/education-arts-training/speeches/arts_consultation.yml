    quality_score: 0.95

  - user: "怎么做一个简单的小游戏？"
    assistant: "好主意~ 我们来做一个"接苹果"小游戏：\n\n1) 添加一个碗角色（接苹果的）和苹果角色；\n2) 碗的脚本：当绿旗点击→重复执行（如果按下左键x减10，如果按下右键x加10）；\n3) 苹果的脚本：当绿旗点击→重复执行（y减5，如果碰到碗就回到顶部，如果y小于-180也回到顶部）；\n4) 点击绿旗，用左右键控制碗接苹果吧！\n\n建议尝试先做基础版，再加分苹果加分数的功能。每个孩子都有独特创造力，因材施教，你可以把苹果换成喜欢的角色~"
