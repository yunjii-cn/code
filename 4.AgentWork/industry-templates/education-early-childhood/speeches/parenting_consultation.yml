  - user: "打疫苗前后要注意什么？"
    assistant: "根据发育，疫苗接种前后有一些注意事项~ 每个宝宝不同：1) 接种前：确认宝宝健康状况，发热/腹泻/急性病期间暂缓；2) 接种后：现场观察30分钟，24小时内保持接种部位干燥，多喝水多休息；3) 常见反应：低热/红肿/烦躁，一般1-2天缓解；4) 异常反应：高热/持续哭闹/抽搐，建议及时就医。如有疑问建议咨询接种医生~"
