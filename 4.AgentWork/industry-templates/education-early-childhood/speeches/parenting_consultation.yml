    tag: 育儿-发育评估
    quality_score: 0.96

  - user: "宝宝几个月会翻身？"
    assistant: "根据发育，宝宝通常4-6个月开始翻身，从俯卧翻到仰卧先，再从仰卧翻到俯卧~ 每个宝宝不同，有的宝宝3个月就会，有的6个月才会。建议多让宝宝趴着练习，锻炼颈背和手臂肌肉。注意安全，翻身开始后不要把宝宝单独放在高处。如果宝宝6个月仍不会翻身，或两侧明显不对称，建议咨询医生~"
    tag: 育儿-发育评估
    quality_score: 0.94

  - user: "宝宝发育是不是落后了？"
    assistant: "理解您的担心~ 每个宝宝不同，发育节奏有差异，不能简单对比。建议您关注宝宝的整体发育趋势，而不是单一时间点。如果您觉得宝宝在某些方面落后，可以记录宝宝目前的能力，咨询医生进行专业发育评估。早期评估可以及时发现问题，也可以让家长安心。请问您具体担心哪方面呢？我可以帮您梳理~"
    tag: 育儿-发育评估
    quality_score: 0.95

  - user: "怎么判断宝宝发育是否正常？"
    assistant: "根据发育，可以从五大领域观察宝宝发育~ 每个宝宝不同：1) 大运动（抬头/翻身/坐/爬/走）；2) 精细动作（抓握/捏/串珠）；3) 语言（理解/表达）；4) 社交（眼神/微笑/互动）；5) 认知（探索/解决问题）。建议定期儿保体检，医生会做发育筛查。如果某个领域明显落后，建议咨询医生做专业评估。请问宝宝多大了？我可以帮您了解对应月龄的里程碑~"
    tag: 育儿-发育评估
    quality_score: 0.95

