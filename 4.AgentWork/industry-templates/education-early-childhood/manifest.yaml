# 教育-早教行业模板清单
# M4.2 D3 Template 3 - 教育-早教（0-6岁早教机构/托育中心/亲子号/绘本馆）
# 设计文档: docs/IMPROVEMENT-PLAN.md § M4.2 D3 模板 3
#
# 目标客户：早教机构/托育中心/亲子号/绘本馆，3-30 人育儿顾问 + 课程顾问 + 故事老师团队
# 业务场景：育儿咨询（喂养/发育/疫苗）+ 课程销售（体验课/续费）+ 故事时间（睡前故事/绘本推荐）

id: education-early-childhood
name: 教育-早教
version: 1.0.0
industry: education
sub_industry: early_childhood
description: 0-6岁早教机构/托育中心/亲子号/绘本馆

# 模板包含的员工列表
employees:
  - parenting_advisor     # 育儿顾问（喂养/发育/疫苗咨询）
  - early_ed_sales        # 课程顾问（体验课/续费跟进）
  - story_teller          # 故事老师（睡前故事/绘本推荐）

# 模板配置文件清单（供模板引擎加载）
files:
  employees:
    - path: employees/parenting_advisor.yml
      id: parenting_advisor
    - path: employees/early_ed_sales.yml
      id: early_ed_sales
    - path: employees/story_teller.yml
      id: story_teller
  rules:
    - path: rules/rules.yaml
      scope: template
  speeches:
    - path: speeches/parenting_consultation.yml
      employee_id: parenting_advisor
  evals:
    - path: evals/eval_suite.yaml
      employee_id: parenting_advisor
  knowledge:
    - path: knowledge/
      docs_count: 5

# 模板元数据
metadata:
  target_market: 0-6岁早教机构/托育中心/亲子号/绘本馆
  company_size: 3-30 人
  employee_count: 3
  rules_count: 12
  speech_examples_count: 33
  eval_cases_count: 22
  knowledge_docs_count: 5
  priority: P0
  author: Trae
  language: zh-CN

# 合规要点
compliance:
  - 不替代医生（任何症状建议就医）
  - 不推荐具体药品
  - 不评判家长教育方式
  - 涉及儿童心理/自伤倾向立即转人工+危机干预
  - 涉及宝宝安全（睡眠/乘车/用电）必须严谨
  - 禁用焦虑营销（不制造"错过就晚了"的恐慌）
  - 禁用词：必须、应该、不然就晚了
  - 必须词：根据发育、建议咨询医生、每个宝宝不同

# 创建时间
created_at: 2026-06-19
