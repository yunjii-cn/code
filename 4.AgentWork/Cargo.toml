[workspace]
# 云集智能体工作台 (AgentWork) - Rust workspace
# 详细架构见 docs/ARCHITECTURE.md
resolver = "2"
members = [
    "platformkit/crates/timeflow-core",
    "platformkit/crates/aw-git",
    "platformkit/crates/timeflow-ai",
    "platformkit/crates/agent-team",
    "apps/desktop/src-tauri",
    # 以下成员将在后续里程碑创建:
    # "platformkit/crates/timeflow-workflow",
    # "platformkit/crates/timeflow-release",
    # "platformkit/crates/aw-runtime",
    # "platformkit/crates/aw-sandbox",
    # "apps/cli",
    # "apps/mcp-bridge",
]
exclude = [
    "target",
    "node_modules",
    "dist",
    "build",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Yunji AI <agentwork@yunji.ai>"]
license = "Apache-2.0"
repository = "https://github.com/yunji/agentwork"

[workspace.dependencies]
# 核心依赖 (所有 crate 共享)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Git 操作
git2 = "0.19"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP 协议
rmcp = { version = "0.1", features = ["server", "client", "transport-io"] }

# GitHub API
octocrab = "0.39"

# 配置
toml = "0.8"
config = "0.14"

# 文件监控
notify = "6.1"
notify-debouncer-mini = "0.4"

# 编码
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

# 测试
proptest = "1.5"
mockall = "0.13"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
incremental = true

# 加快增量编译
[profile.dev.package."*"]
opt-level = 0
debug = 1
incremental = true
